<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odyssey motion study</title>
    <style>
      * { box-sizing: border-box; }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f3eb;
        color: #28312b;
        font-family: Arial, Helvetica, sans-serif;
      }

      .demo {
        width: min(920px, 100%);
      }

      .scene {
        position: relative;
        width: 100%;
        aspect-ratio: 12 / 7;
        overflow: hidden;
        border-radius: 8px;
        background: #173747;
        box-shadow: 0 18px 48px rgba(34, 47, 40, .18);
        isolation: isolate;
      }

      .layer {
        position: absolute;
        display: block;
        pointer-events: none;
        user-select: none;
        animation-play-state: paused !important;
        will-change: transform;
      }

      .is-playing .layer {
        animation-play-state: running !important;
      }

      .background {
        inset: -2%;
        width: 104%;
        height: 104%;
        object-fit: cover;
      }

      .clouds {
        z-index: 1;
        top: -5%;
        left: -4%;
        width: 108%;
        opacity: .32;
        animation: cloud-drift 16s ease-in-out infinite alternate;
      }

      .boat {
        z-index: 2;
        left: 24%;
        bottom: 5%;
        width: 54%;
        transform-origin: 50% 76%;
        filter: drop-shadow(0 10px 12px rgba(10, 27, 35, .25));
        animation: boat-float 4.8s ease-in-out infinite;
      }

      .waves {
        z-index: 3;
        left: -3%;
        bottom: -5%;
        width: 106%;
        animation: wave-drift 5.6s ease-in-out infinite alternate;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 20px;
      }

      .play {
        width: 58px;
        height: 58px;
        flex: 0 0 auto;
        border: 4px solid #fff;
        border-radius: 50%;
        background: #48644f;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 7px 17px rgba(47, 71, 54, .24);
      }

      .copy strong,
      .copy span { display: block; }
      .copy span { margin-top: 4px; color: #747970; font-size: 13px; }

      @keyframes cloud-drift {
        from { transform: translate3d(-8px, 0, 0); }
        to { transform: translate3d(12px, -3px, 0); }
      }

      @keyframes boat-float {
        0%, 100% { transform: translate3d(0, 2px, 0) rotate(-.45deg); }
        50% { transform: translate3d(0, -6px, 0) rotate(.65deg); }
      }

      @keyframes wave-drift {
        from { transform: translate3d(-8px, 3px, 0) scale(1.01); }
        to { transform: translate3d(8px, -2px, 0) scale(1.015); }
      }

      @media (prefers-reduced-motion: reduce) {
        .layer { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <div class="scene" id="scene">
        <img class="layer background" src="../../stories/odyssey/scenes/s01/background.png" alt="Biển Aegean lúc chạng vạng" />
        <img class="layer clouds" src="../../stories/odyssey/scenes/s01/clouds.png" alt="" />
        <img class="layer boat" src="../../stories/odyssey/scenes/s01/boat.png" alt="Con thuyền của Odysseus" />
        <img class="layer waves" src="../../stories/odyssey/scenes/s01/waves.png" alt="" />
      </div>

      <div class="controls">
        <button class="play" id="play" type="button" aria-label="Phát audio">▶</button>
        <div class="copy">
          <strong>The Odyssey</strong>
          <span>Nhấn Play để nghe và làm bức tranh chuyển động.</span>
        </div>
      </div>

      <audio id="audio" preload="metadata" src="../../stories/odyssey/audio/page-01.mp3"></audio>
    </main>

    <script>
      const scene = document.querySelector("#scene");
      const play = document.querySelector("#play");
      const audio = document.querySelector("#audio");

      function syncPlayingState() {
        const playing = !audio.paused && !audio.ended;
        scene.classList.toggle("is-playing", playing);
        play.textContent = playing ? "Ⅱ" : "▶";
        play.setAttribute("aria-label", playing ? "Tạm dừng audio" : "Phát audio");
      }

      play.addEventListener("click", () => {
        if (audio.paused) audio.play();
        else audio.pause();
      });

      audio.addEventListener("play", syncPlayingState);
      audio.addEventListener("pause", syncPlayingState);
      audio.addEventListener("ended", syncPlayingState);
    </script>
  </body>
</html>
